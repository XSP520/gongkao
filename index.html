<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0f14">
<title>公考作战台</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
:root{
  --bg:#0d0f14; --surface:#141821; --card:#1b2130; --card2:#232b3e;
  --border:#2b3245; --text:#e8ecf5; --muted:#9aa4ba; --dim:#6c7488;
  --accent:#4c8dff; --accent2:#8b6cff; --green:#2fbf71; --red:#ff5d5d;
  --orange:#ffb020; --yellow:#ffd166; --pink:#ff6b9d; --cyan:#3ec6d6;
}
html,body{height:100%;}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px; line-height:1.65; padding-bottom:74px;
  -webkit-font-smoothing:antialiased;
}
/* Header */
#hdr{position:sticky;top:0;z-index:50;background:rgba(13,15,20,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;}
#hdr .logo{font-weight:800;font-size:17px;letter-spacing:.5px;}
#hdr .logo span{color:var(--accent);}
#hdr .count{background:var(--card2);border:1px solid var(--border);border-radius:20px;padding:3px 12px;font-size:13px;color:var(--yellow);font-weight:700;}
#hdr .count.red{color:var(--red);}

/* Views */
#main{max-width:640px;margin:0 auto;padding:14px 14px 20px;}
.view{display:none;animation:fade .18s ease;}
.view.active{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

/* Bottom nav */
#tabbar{position:fixed;bottom:0;left:0;right:0;z-index:60;background:rgba(16,19,27,.96);backdrop-filter:blur(10px);
  border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom);}
#tabbar button{flex:1;background:none;border:none;color:var(--muted);font-size:11px;padding:9px 2px 8px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit;}
#tabbar button .ic{font-size:20px;line-height:1;}
#tabbar button.on{color:var(--accent);}
#tabbar button.on .ic{color:var(--accent);}

/* Cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px;}
.card h3{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px;color:var(--text);}
.card h3 .tag{font-size:11px;color:var(--muted);font-weight:400;}
.section-title{font-size:13px;color:var(--muted);margin:18px 2px 10px;font-weight:600;letter-spacing:.5px;}

/* Buttons */
.btn{display:block;width:100%;border:none;border-radius:14px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;
  background:var(--accent);color:#fff;text-align:center;font-family:inherit;transition:transform .05s,filter .15s;}
.btn:active{transform:scale(.98);filter:brightness(1.1);}
.btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--border);}
.btn.green{background:var(--green);}
.btn.red{background:var(--red);}
.btn.warn{background:var(--orange);color:#1a1200;}
.btn.sm{padding:10px;font-size:14px;border-radius:11px;}
.btn.grp{display:flex;gap:10px;}
.btn.grp .btn{flex:1;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

/* Grid */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}

/* Stat blocks */
.stat-row{display:flex;gap:10px;margin-bottom:10px;}
.stat{flex:1;background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:12px;text-align:center;}
.stat .num{font-size:24px;font-weight:800;line-height:1.2;}
.stat .lbl{font-size:12px;color:var(--muted);margin-top:2px;}
.num.accent{color:var(--accent);}.num.green{color:var(--green);}.num.red{color:var(--red);}
.num.yellow{color:var(--yellow);}.num.orange{color:var(--orange);}

/* List */
.list-item{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:13px 14px;margin-bottom:10px;cursor:pointer;}
.list-item:active{background:var(--card2);}
.list-item .t{font-weight:600;font-size:15px;}
.list-item .s{font-size:13px;color:var(--muted);margin-top:2px;}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;}

/* Chips */
.chip{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;border:1px solid var(--border);background:var(--card2);color:var(--muted);margin:0 4px 4px 0;}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent);}
.chip.diff-basic{color:var(--green);border-color:var(--green);}
.chip.diff-mid{color:var(--orange);border-color:var(--orange);}
.chip.diff-high{color:var(--red);border-color:var(--red);}

/* Timer */
.timer{font-variant-numeric:tabular-nums;font-weight:800;}
.timer-big{font-size:30px;text-align:center;color:var(--yellow);letter-spacing:1px;}
.timer.warn{color:var(--orange);}.timer.danger{color:var(--red);}

/* Progress bar */
.pbar{height:9px;background:var(--card2);border-radius:10px;overflow:hidden;margin:8px 0;}
.pbar .fill{height:100%;border-radius:10px;background:var(--accent);transition:width .3s;}
.pbar .fill.green{background:var(--green);}.pbar .fill.red{background:var(--red);}
.pbar .fill.orange{background:var(--orange);}.pbar .fill.yellow{background:var(--yellow);}

/* Horizontal bar chart */
.hbar{margin-bottom:10px;}
.hbar .top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px;}
.hbar .top .v{color:var(--muted);}
.hbar .track{height:10px;background:var(--card2);border-radius:8px;overflow:hidden;}
.hbar .track .f{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:8px;}

/* Question options */
.opt{display:flex;align-items:flex-start;gap:10px;background:var(--card);border:1.5px solid var(--border);border-radius:14px;
  padding:13px 14px;margin-bottom:11px;cursor:pointer;font-size:15px;}
.opt:active{background:var(--card2);}
.opt .key{flex-shrink:0;width:26px;height:26px;border-radius:50%;background:var(--card2);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;margin-top:1px;}
.opt.correct{background:rgba(47,191,113,.14);border-color:var(--green);}
.opt.correct .key{background:var(--green);color:#04140b;border-color:var(--green);}
.opt.wrong{background:rgba(255,93,93,.14);border-color:var(--red);}
.opt.wrong .key{background:var(--red);color:#fff;border-color:var(--red);}
.opt.dim{opacity:.5;}

/* Analysis box */
.ana{border-left:3px solid var(--accent);background:var(--card2);border-radius:0 12px 12px 0;padding:13px 14px;margin:12px 0;font-size:14px;}
.ana .h{font-weight:700;color:var(--accent);margin-bottom:4px;}
.ana .h.red{color:var(--red);}.ana .h.green{color:var(--green);}.ana .h.orange{color:var(--orange);}
.ana p{margin:4px 0;color:var(--text);}
.ana .k{color:var(--muted);font-size:13px;}

/* Tabs (in-view) */
.seg{display:flex;background:var(--card2);border-radius:12px;padding:4px;gap:4px;margin-bottom:12px;overflow-x:auto;}
.seg button{flex:1;min-width:max-content;background:none;border:none;color:var(--muted);padding:9px 8px;border-radius:9px;font-size:13px;cursor:pointer;font-family:inherit;}
.seg button.on{background:var(--accent);color:#fff;font-weight:700;}

/* Inputs */
input,textarea,select{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:11px;color:var(--text);
  padding:11px 13px;font-size:15px;font-family:inherit;outline:none;}
input:focus,textarea:focus,select:focus{border-color:var(--accent);}
textarea{min-height:90px;resize:vertical;line-height:1.6;}
label.fl{font-size:13px;color:var(--muted);display:block;margin:12px 0 5px;font-weight:600;}
.help{font-size:12px;color:var(--dim);margin-top:4px;}

/* Toast */
#toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--border);
  color:var(--text);padding:10px 18px;border-radius:24px;font-size:14px;z-index:200;display:none;max-width:88%;text-align:center;
  box-shadow:0 8px 24px rgba(0,0,0,.5);}
#toast.show{display:block;animation:fade .2s;}

/* Modal */
#modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.68);z-index:150;display:none;align-items:flex-end;justify-content:center;}
#modal-bg.show{display:flex;}
#modal{background:var(--surface);border:1px solid var(--border);border-radius:20px 20px 0 0;width:100%;max-width:640px;
  max-height:88vh;overflow-y:auto;padding:20px 18px;animation:slideup .22s ease;}
@keyframes slideup{from{transform:translateY(30px);opacity:0;}to{transform:none;opacity:1;}}
#modal .close{float:right;background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;line-height:1;}

/* Subview back bar */
.backbar{display:flex;align-items:center;gap:8px;color:var(--muted);cursor:pointer;margin-bottom:12px;font-size:14px;}
.backbar:active{color:var(--text);}

/* Misc */
.mood-row{display:flex;gap:10px;}
.mood-btn{flex:1;padding:13px;border-radius:13px;border:1.5px solid var(--border);background:var(--card);text-align:center;cursor:pointer;}
.mood-btn .e{font-size:22px;}
.mood-btn .l{font-size:13px;color:var(--muted);margin-top:2px;}
.mood-btn.on{border-color:var(--accent);background:rgba(76,141,255,.12);}
.mood-btn.on .l{color:var(--text);}
.mood-btn.m-good.on{border-color:var(--green);background:rgba(47,191,113,.12);}
.mood-btn.m-bad.on{border-color:var(--red);background:rgba(255,93,93,.12);}

.quote{background:linear-gradient(135deg,var(--card2),var(--card));border:1px solid var(--border);border-left:3px solid var(--yellow);
  border-radius:12px;padding:14px;font-size:14px;color:var(--text);margin-bottom:10px;}
.badge{display:inline-flex;align-items:center;gap:5px;background:var(--card2);border:1px solid var(--border);border-radius:8px;
  padding:3px 9px;font-size:12px;color:var(--muted);}
.gap{margin-top:14px;}
.muted{color:var(--muted);font-size:13px;}
.small{font-size:12px;color:var(--dim);}
.center{text-align:center;}
hr.sep{border:none;border-top:1px solid var(--border);margin:14px 0;}
.checklist label{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--border);font-size:15px;}
.checklist label:last-child{border-bottom:none;}
.checklist input{width:20px;height:20px;flex-shrink:0;accent-color:var(--accent);}
.strike{text-decoration:line-through;color:var(--dim);}
.big-num{font-size:40px;font-weight:800;text-align:center;line-height:1.1;}
.big-num small{font-size:15px;color:var(--muted);font-weight:400;}
svg.chart{width:100%;height:auto;display:block;}
</style>
</head>
<body>

<header id="hdr">
  <div class="logo">⚔️ 公考<span>作战台</span></div>
  <div class="count" id="hdrCount">未设置</div>
</header>

<main id="main">
  <section id="view-home" class="view"></section>
  <section id="view-practice" class="view"></section>
  <section id="view-wrong" class="view"></section>
  <section id="view-exam" class="view"></section>
  <section id="view-data" class="view"></section>
  <section id="view-sub" class="view"></section>
</main>

<nav id="tabbar">
  <button data-tab="home"><span class="ic">🏠</span>作战台</button>
  <button data-tab="practice"><span class="ic">📝</span>刷题</button>
  <button data-tab="wrong"><span class="ic">📕</span>错题本</button>
  <button data-tab="exam"><span class="ic">🎯</span>模拟考</button>
  <button data-tab="data"><span class="ic">📊</span>数据</button>
</nav>

<div id="toast"></div>
<div id="modal-bg"><div id="modal"></div></div>

<script>
"use strict";
/* ============ 题库构建辅助 ============ */
let __qid=0;
const Q=(mod,diff,topic,stem,opts,ans,kd,steps,skill,trap)=>({id:'q'+(++__qid),mod,diff,topic,stem,opts,ans,analysis:{kd,steps,skill,trap}});
const MODS={
  yuyan:{name:'言语理解',icon:'💬'},
  panduan:{name:'判断推理',icon:'🧩'},
  ziliao:{name:'资料分析',icon:'📈'},
  changshi:{name:'常识判断',icon:'🌍'},
  shuliang:{name:'数量关系',icon:'🔢'}
};
const DIFFS={basic:'基础',mid:'强化',high:'冲刺'};
const MODKEYS=['yuyan','panduan','ziliao','changshi','shuliang'];

const BANK={
yuyan:[
Q('yuyan','basic','中心理解','人类对信息的记忆并非照相机式的完整复制，而是一个主动建构的过程。我们记住的往往是那些对自身有意义、能与我们已有经验建立联系的内容。这句话意在强调：',['记忆是对现实的忠实记录','记忆具有主动性和选择性','有意义的信息更难被记住','经验会干扰记忆的准确性'],1,'考点：中心理解——抓主旨句、主题词"主动建构"。','通读后锁定主旨：记忆是"主动建构"的过程，记住的是"有意义、能建立联系"的内容，说明记忆不是被动复制，而是有选择、主动的。','中心理解题先找转折词、总结句，锁定核心观点，选项要覆盖主题词。','A"忠实记录"与原文"并非完整复制"相反；D"干扰"属无中生有。'),
Q('yuyan','basic','中心理解','近年来，人工智能技术在各行各业加速落地，但技术本身是中性的，关键在于如何驾驭它。只有在法律法规、伦理规范的框架内发展人工智能，才能真正造福人类。文段的核心意思是：',['人工智能技术已经成熟','技术中性，关键在规范引导','人工智能应当禁止使用','法律会阻碍技术进步'],1,'考点：中心理解——转折后是重点，抓"关键在于如何驾驭"。','首句说技术中性，接着"关键在于如何驾驭"，末句落到"在法规伦理框架内发展才能造福人类"，核心是规范引导。','出现"但、然而、关键"时，其后多为重点。','C"禁止"、D"阻碍"均与文意相反，属过度推断。'),
Q('yuyan','basic','中心理解','乡村要振兴，人才是关键。然而，当前不少农村地区存在人才"引不来、留不住"的困境，其根本原因在于乡村产业基础薄弱、发展空间有限。要让人才扎根乡村，必须先把产业做起来。这段文字主要说明：',['乡村人才流失是正常现象','产业振兴是留住人才的根本','人才越多产业越发达','应当提高乡村人才待遇'],1,'考点：中心理解——对策句是重点。','文段指出困境"根本原因在于产业薄弱"，末句给出对策"必须先把产业做起来"，即产业振兴才能留才。','对策标志词"必须、应当、要"后的内容常是答案。','D"提高待遇"未提及，属过度推断；A"正常现象"曲解文意。'),
Q('yuyan','basic','细节判断','根据文意，下列说法正确的是：某市2023年城镇新增就业12.6万人，其中高校毕业生就业人数占42%，失业人员再就业人数较上年增长8.3%。',['高校毕业生就业人数超过失业人员再就业人数','该市2022年失业人员再就业人数无法直接得出','该市新增就业人数比2022年少','高校毕业生就业比例低于全国平均水平'],1,'考点：细节判断——选项与原文逐一比对，警惕绝对化表述。','原文只给出2023年再就业的"增长率8.3%"，未给2022年基数，故2022年数值无法直接得出。','细节题用"排除法"，无中生有、偷换概念、绝对化选项多为错误项。','A"超过"无法比较；C"少"无据；D"全国"未提及。'),
Q('yuyan','basic','逻辑填空','历史是最好的教科书，也是最好的____。我们要从历史中汲取智慧和力量，坚定前行的信念。',['清醒剂','化妆品','兴奋剂','麻醉剂'],0,'考点：逻辑填空——固定搭配+语境。','"历史是最好的教科书，也是最好的清醒剂"是常见表述，与"汲取智慧、坚定信念"的正面语境一致。','成语/熟语固定搭配要平时积累，选词看感情色彩。','"麻醉剂"含贬义，与正面语境不符。'),
Q('yuyan','basic','逻辑填空','乡村振兴战略的____实施，为农业农村发展注入了强大动力，广大农村面貌发生了历史性变化。',['深入','深刻','深化','深邃'],0,'考点：逻辑填空——词语搭配"深入实施"。','"深入实施"是固定搭配，表示推进到深层。','动词前常用"深入"，注意近义词的搭配对象差异。','"深刻"多修饰认识、变化；"深化"是动词。'),
Q('yuyan','basic','逻辑填空','面对复杂严峻的国际形势，我们要保持战略定力，____办好自己的事情。',['专心','专注','聚精会神','凝神'],1,'考点：逻辑填空——搭配"专注于办好"。','"专注办好自己的事情"搭配自然，强调集中精力。','近义辨析看搭配与语体，此处"专注"最贴切。','"专心"多接"致志"或具体动作，此处"专注"更佳。'),
Q('yuyan','basic','中心理解','城市的活力，不仅体现在高楼大厦，更体现在街巷里升腾的烟火气。一座有温度的城市，应当让每个普通人都有尊严地生活、体面地工作。这段文字意在说明：',['城市要多建高楼','城市发展的核心是烟火气','城市的温度在于对普通人的关怀','城市应限制高楼建设'],2,'考点：中心理解——"不仅…更…"递进，重点在后。','递进关系"不仅…更…"，重点在"让每个普通人都有尊严、体面地生活"，即对普通人的关怀。','递进关系中后项更重要，抓"更、甚至"后面的内容。','B"烟火气"只是表意之一，核心是"对普通人的关怀"。'),
Q('yuyan','basic','细节判断','下列关于"数字经济"的表述，与原文相符的是：2022年我国数字经济规模达50.2万亿元，占GDP比重41.5%，增速高于同期GDP增速。',['数字经济占GDP比重超过一半','数字经济规模突破50万亿元','数字经济增速低于GDP增速','数字经济已取代实体经济'],1,'考点：细节判断——数字比对。','原文"50.2万亿元"即"突破50万亿"，表述正确。','涉及数字的选项要回到原文精确比对。','A"超过一半"错(41.5%)；C"低于"错；D"取代"无中生有。'),
Q('yuyan','basic','逻辑填空','文化自信是一个国家、一个民族发展中更基本、更深沉、更____的力量。',['持久','长久','持续','恒久'],0,'考点：逻辑填空——固定搭配"更持久的力量"。','"更基本、更深沉、更持久的力量"是规范表述，选"持久"。','规范表述要熟记，尤其时政类固定提法。','"恒久"过于书面，此处官方表述为"持久"。'),
Q('yuyan','basic','中心理解','阅读的意义，不在于记住多少知识点，而在于它能在潜移默化中塑造一个人的精神气质。一个坚持阅读的人，往往拥有更开阔的视野和更平和的心态。文段主要强调的是：',['阅读要记住很多知识','阅读能塑造精神气质','阅读使人视野狭窄','读书越多越焦虑'],1,'考点：中心理解——"不在于…而在于…"重点在后。','转折"不在于…而在于…"，重点在"塑造精神气质"，末句举例说明。','"不是…而是…、不在于…而在于"结构，后项为重点。','A"记住知识"是作者否定的内容。'),
Q('yuyan','basic','逻辑填空','基层治理需要____社会各方力量，形成共建共治共享的治理格局。',['整合','结合','联合','混合'],0,'考点：逻辑填空——"整合力量"搭配。','"整合社会各方力量"表示把分散的力量统合起来，符合"共建共治共享"。','动词与宾语的固定搭配要积累。','"结合"多指两者连接，不如"整合"准确。'),
Q('yuyan','mid','中心理解','有人说，慢是一种能力，也是一种境界。在快节奏的时代，能够慢下来、静下心，专注做好一件事，本身就是一种难得的定力。这段话的启示是：',['做事越快越好','要拒绝一切快节奏','慢下来专注做事是可贵的能力','慢与快是对立的'],2,'考点：中心理解——观点句后举例，抓"慢是一种能力"。','文段中心是"慢是一种能力、境界"，强调专注、定力，启示是要学会慢下来专注。','启示类题答案多为引申出的正向道理，避免绝对化。','B"拒绝一切"绝对化；D"对立"曲解。'),
Q('yuyan','mid','中心理解','保护生态环境就是保护生产力，改善生态环境就是发展生产力。绿水青山既是自然财富，又是经济财富。这段文字主要说明：',['生态环境与生产力相互矛盾','生态本身就是经济价值','发展经济必须牺牲生态','生态保护阻碍经济发展'],1,'考点：中心理解——主旨句+比喻论证。','文段说明生态保护就是发展生产力，"绿水青山既是自然财富又是经济财富"，即生态本身就是价值。','并列结构要概括全面，抓住"生态=财富/生产力"。','A、D"矛盾/阻碍"与文意相反。'),
Q('yuyan','mid','细节判断','根据材料，下列表述不正确的是：2023年上半年，全国居民人均可支配收入19672元，同比增长6.5%；其中城镇居民人均可支配收入26984元，农村居民人均可支配收入10551元。',['农村居民人均可支配收入低于城镇居民','全国居民人均可支配收入同比上升','城镇居民收入约为农村居民的两倍多','农村居民收入增速低于城镇居民'],3,'考点：细节判断——"不正确"要反向选择，警惕未提及信息。','原文只给收入数值和全国增速，未给城乡居民各自的增速，故D"增速比较"无依据。','题干问"不正确/不符合"时要特别警惕，逐个排除。','C"两倍多"(26984/10551≈2.56)正确，勿误判。'),
Q('yuyan','mid','逻辑填空','新时代的青年要志存高远，更要____，把远大理想落实到实际行动中。',['脚踏实地','好高骛远','纸上谈兵','夸夸其谈'],0,'考点：逻辑填空——成语辨析，语境是"落实到行动"。','"脚踏实地"与"落实到实际行动"呼应，表示务实。','成语题先看感情色彩，再扣语境关键词。','"好高骛远、纸上谈兵、夸夸其谈"均为贬义，与"落实到行动"矛盾。'),
Q('yuyan','mid','逻辑填空','历史是最好的清醒剂，我们决不能____历史虚无主义的错误，要旗帜鲜明反对歪曲历史。',['重蹈','重复','重演','重现'],0,'考点：逻辑填空——"重蹈覆辙"固定搭配。','"决不能重蹈历史虚无主义的错误"，"重蹈覆辙"引申为再犯同类错误。','积累成语"重蹈覆辙"，注意"蹈"的搭配。','"重演、重现"不与"错误"直接搭配。'),
Q('yuyan','mid','中心理解','创新是引领发展的第一动力。抓创新就是抓发展，谋创新就是谋未来。谁牵住了科技创新这个"牛鼻子"，谁就能占领先机、赢得优势。文段强调：',['创新是可有可无的','科技创新是发展的关键','发展不需要创新','未来不可预测'],1,'考点：中心理解——比喻句"牛鼻子"是题眼。','文段反复强调"创新是第一动力"，"牛鼻子"比喻关键，核心是科技创新对发展的关键作用。','比喻词(牛鼻子、压舱石、定盘星)往往指向核心意思。','A、C与文意相反。'),
Q('yuyan','mid','细节判断','下列与原文相符的是：某平台直播带货数据显示，农产品直播间观看人数同比增长45%，成交额增长28%，复购率由18%提升至26%。',['农产品直播观看人数下降','成交额增速高于观看人数增速','复购率同比提高8个百分点','直播带货整体亏损'],2,'考点：细节判断——百分点与百分比辨析。','复购率由18%升至26%，提高8个百分点，表述正确。','"百分点"是绝对差值(26%-18%=8个百分点)，与"增长率"不同。','B比较错误(45%>28%)。'),
Q('yuyan','mid','逻辑填空','做好宣传思想工作，要____主旋律、弘扬正能量，巩固壮大主流思想舆论。',['唱响','唱起','歌唱','演唱'],0,'考点：逻辑填空——固定搭配"唱响主旋律"。','"唱响主旋律、弘扬正能量"是官方固定表述。','时政固定搭配要熟记。','其他选项搭配生硬。'),
Q('yuyan','mid','中心理解','良好的营商环境就像阳光、水和空气，须臾不能缺少。优化营商环境，就是解放生产力、提高竞争力。这段话意在说明：',['营商环境可有可无','营商环境至关重要','企业不需要良好环境','环境与生产力无关'],1,'考点：中心理解——比喻论证，抓"须臾不能缺少"。','"像阳光水和空气，须臾不能缺少"强调营商环境的极端重要性。','比喻的"本体"往往就是主题，重要性用比喻凸显。','A、C、D均与文意相反。'),
Q('yuyan','mid','逻辑填空','调查研究是我们党的传家宝，是做好各项工作的____。',['基本功','基本盘','基本面','基础课'],0,'考点：逻辑填空——"基本功"搭配。','"调查研究是做好工作的基本功"是规范表述。','熟记常见固定提法。','"基本盘、基本面"语义不符。'),
Q('yuyan','mid','细节判断','下列表述与材料不符的是：我国新能源汽车产销量连续多年位居世界第一，2023年市场占有率达31.6%，出口量同比增长77%。',['我国新能源汽车销量全球领先','2023年新能源汽车市场占有率超三成','新能源汽车出口量同比下降','我国新能源汽车竞争力增强'],2,'考点：细节判断——反向选择。','原文"出口量同比增长77%"，C说"下降"与原文矛盾，故为不符项。','问"不符"时，直接找与原文数字/方向相反的选项。','其余选项均与原文一致。'),
Q('yuyan','mid','中心理解','文化惠民，不仅要让群众"有戏看"，更要让群众"看好戏"。这就要求我们既要增加供给数量，更要提升供给质量。文段的主旨是：',['文化供给数量最重要','文化惠民要量质并举、以质为重','群众不喜欢看戏','只提升数量即可'],1,'考点：中心理解——"不仅…更…"递进，重点在"质量"。','"不仅要有戏看，更要看好戏"递进强调质量，"既要…更要…"再次强调以质为重。','递进关系后项为重点。','A"数量最重要"错，D"只提升数量"错。'),
Q('yuyan','mid','逻辑填空','广大党员干部要____初心、____使命，始终保持同人民群众的血肉联系。',['牢记、担负','铭记、履行','不忘、践行','忘记、抛弃'],2,'考点：逻辑填空——固定搭配"不忘初心、践行使命"。','"不忘初心、牢记使命"及"践行初心使命"是规范表述。','时政术语要精准记忆。','D语义完全相反。'),
Q('yuyan','high','中心理解','有人认为，碎片化阅读会导致思维浅薄。但事实上，阅读方式的改变并不意味着阅读能力的退化，关键在于能否在碎片中保持系统思考的能力。作者对碎片化阅读的态度是：',['完全否定','完全肯定','辩证看待，强调系统思考','认为其必然导致浅薄'],2,'考点：中心理解——态度题，抓"但事实上"后的观点。','作者先引他人观点，再以"但事实上"转折，认为关键是"能否保持系统思考"，态度辩证。','态度题看转折词后的作者立场，避免只取片面。','A、D是作者反驳的观点，B过于绝对。'),
Q('yuyan','high','中心理解','城市的记忆，不在别处，就在那些斑驳的砖墙、古老的街巷和一代代人的口口相传里。保护城市文脉，就是留住一座城的根与魂。文段旨在强调：',['要拆除老建筑','保护城市文脉很重要','城市记忆无法保存','砖墙比人更重要'],1,'考点：中心理解——末句总结"留住根与魂"。','文段描述城市记忆的载体，落到"保护文脉就是留住根与魂"，强调保护的重要性。','总结句常在文末，注意"就是"等判断词。','A与文意相反。'),
Q('yuyan','high','细节判断','根据材料，可以推出的是：某研究显示，每天阅读30分钟以上的人群中，78%的人表示焦虑水平明显低于不阅读者；且阅读时间越长，这一比例越高。',['阅读一定能消除焦虑','阅读时间与焦虑降低存在正相关','不阅读的人都会焦虑','78%的人都爱阅读'],1,'考点：细节判断——"推出"需合理推断，警惕绝对化。','材料显示阅读时间越长、焦虑降低比例越高，可推出正相关。','"可以推出"题选能从原文合理推出的，排除绝对化与无中生有。','A"一定"、C"都"绝对化；D偷换概念。'),
Q('yuyan','high','逻辑填空','越是形势复杂、任务艰巨，越要____，保持战略定力，集中精力办好自己的事情。',['慌不择路','镇定自若','心浮气躁','急于求成'],1,'考点：逻辑填空——语境是"保持战略定力"。','"镇定自若"与"保持战略定力"呼应，表示从容冷静。','选词要扣住上下文的关键提示词"定力"。','A、C、D都是慌乱急躁的贬义词，与语境相反。'),
Q('yuyan','high','逻辑填空','新时代的伟大成就是党和人民一道拼出来、干出来、____出来的。',['奋斗','拼斗','斗争','斗智'],0,'考点：逻辑填空——固定表述"拼出来、干出来、奋斗出来"。','官方表述为"拼出来、干出来、奋斗出来的"，选"奋斗"。','重大时政金句要准确记忆。','其他选项非规范表述。'),
Q('yuyan','high','中心理解','基层减负，减的是形式主义的"负"，增的是实干担当的"能"。只有把干部从无谓的事务中解脱出来，才能让他们把更多精力投入为群众办实事上。文段意在说明：',['基层不需要减负','减负是为了让干部多干事、干实事','干部都应少做事','形式主义可以保留'],1,'考点：中心理解——"减负"的真正目的是"增能"。','文段说明减负是减形式主义、增实干，目的是让干部投入为群众办实事。','对仗句"减…增…"要抓住真正的落脚点。','C、D明显错误。'),
Q('yuyan','high','细节判断','下列与原文一致的是：2023年，我国货物贸易进出口总值41.76万亿元，同比增长0.2%；其中出口23.77万亿元，增长0.6%。',['进出口总值同比微增','出口总值同比下降','进出口总值突破50万亿','出口增幅低于0.2%'],0,'考点：细节判断——数字精确比对。','原文"进出口总值同比增长0.2%"，A"微增"表述准确。','数字题精确比对方向和幅度。','B"下降"错；C"50万亿"错；D出口增长0.6%>0.2%。'),
Q('yuyan','high','逻辑填空','新征程上，我们要坚定信心、____、乘势而上，不断开创事业新局面。',['踌躇满志','意气风发','埋头苦干','畏首畏尾'],2,'考点：逻辑填空——并列语境，选正向务实的词。','"坚定信心、埋头苦干、乘势而上"构成并列，均表积极务实。','并列结构中词语的感情色彩和语义方向要一致。','D"畏首畏尾"贬义，与并列语境不符。'),
Q('yuyan','high','中心理解','数字技术赋能传统产业，不是简单地把线下搬到线上，而是要推动生产方式、组织方式和商业模式的系统性变革。这段话强调：',['数字化就是线上化','数字化转型是系统性变革','传统产业不需要数字化','线下业务应被淘汰'],1,'考点：中心理解——"不是…而是…"重点在后。','"不是简单搬到线上，而是系统性变革"，强调转型是系统性的。','"不是…而是…"结构后项是重点。','A"就是线上化"是作者否定的观点。'),
Q('yuyan','high','细节判断','根据材料，不能推出的是：某高校调查显示，参加社会实践的学生中，超过60%的人认为沟通协作能力显著提升，这一比例在理工科学生中更高。',['社会实践有助于提升沟通能力','理工科学生提升比例可能更高','所有学生沟通能力都提升了','社会实践有积极意义'],2,'考点：细节判断——"不能推出"反向选择，警惕以偏概全。','材料只涉及"参加社会实践的学生"，C"所有学生"范围扩大，无法推出。','范围扩大、绝对化表述往往是"不能推出"的答案。','A、B、D可由原文合理推出。'),
Q('yuyan','high','逻辑填空','解决民生问题，既要有"时时放心不下"的责任感，更要有"____"的实功夫。',['喊破嗓子','甩开膀子','走马观花','纸上谈兵'],1,'考点：逻辑填空——对举结构，选"实功夫"对应的行动词。','"甩开膀子"与"实功夫"呼应，表示真抓实干、身体力行。','对举结构前后语义相对或呼应，抓关键词"实功夫"。','A、C、D均为虚、懒、浮的贬义词。'),
Q('yuyan','high','中心理解','回望历史，任何一个国家的崛起，都离不开教育的支撑；展望未来，人才竞争的背后，说到底还是教育的竞争。文段强调的核心是：',['教育是国家发展的基础支撑','人才不如教育重要','历史比未来重要','国家崛起不需要教育'],0,'考点：中心理解——并列+总结，抓"说到底"。','文段从历史和未来两个角度说明教育的重要性，核心是"教育是国家发展的基础支撑"。','"说到底"提示本质总结句。','B、C、D偏离或错误。'),
Q('yuyan','high','细节判断','下列说法正确的是：某县通过发展特色农业，带动2.3万户农户增收，人均年增收3800元，村集体经济收入平均增长25%。',['特色农业带动了农户增收','农户人均年增收3800万元','村集体经济收入下降','只有少数农户受益'],0,'考点：细节判断——单位与方向辨析。','原文"人均年增收3800元"，A表述正确。','注意"元"与"万元"等单位陷阱。','B单位错误(3800万元)；C"下降"错。'),
Q('yuyan','high','逻辑填空','面对世界百年未有之大变局，我们必须增强机遇意识和风险意识，准确识变、科学应变、____求变。',['主动','被动','消极','无奈'],0,'考点：逻辑填空——固定搭配"主动求变"。','"准确识变、科学应变、主动求变"是规范表述。','时政术语要精准记忆。','其余选项与"求变"积极语境不符。'),
Q('yuyan','high','中心理解','真正的成长，不是年龄的增长，而是心智的成熟。一个人成熟的标志，是懂得对自己的选择负责，对身边的人温柔以待。文段的主旨是：',['年龄越大越成熟','成熟是懂得负责与温柔','成长等于变老','成熟与年龄无关且无意义'],1,'考点：中心理解——"不是…而是…"重点在后。','"成长不是年龄增长，而是心智成熟"，末句解释成熟标志是"负责、温柔"。','判断词"是"后往往揭示主题。','C、D错误。'),
Q('yuyan','high','细节判断','与原文相符的是：研究发现，坚持运动的人群中，睡眠质量良好者占比达72%，而不运动人群中这一比例仅为45%。',['运动有助于改善睡眠质量','不运动的人睡眠都差','运动必然导致失眠','睡眠与运动无关'],0,'考点：细节判断——比例对比可推出正相关。','运动人群睡眠良好比例(72%)显著高于不运动人群(45%)，可推出运动有助睡眠。','对比数据可推结论，但要避免"都、必然"绝对化。','B、C绝对化，D与数据相悖。'),
Q('yuyan','high','逻辑填空','实现中华民族伟大复兴，需要一代又一代人____奋斗、接续努力。',['持续','断续','间歇','中断'],0,'考点：逻辑填空——"接续奋斗"固定搭配。','"接续奋斗"是规范表述，与"一代又一代"呼应。','熟记"接续奋斗"等固定搭配。','B、C、D语义相反。'),
Q('yuyan','high','中心理解','有人认为互联网让人变得冷漠。然而，无数事实表明，网络让素不相识的人也能守望相助，让爱心跨越千山万水。作者意在说明：',['网络使人冷漠','网络也能传递温暖','网络只会带来负面','网络没有积极作用'],1,'考点：中心理解——转折后是作者立场。','"然而"转折，作者以事实说明网络也能守望相助、传递爱心。','转折词后是作者真正想表达的观点。','A、C、D与作者立场相反。'),
Q('yuyan','high','细节判断','根据材料，下列可推出的是：某市推行"一网通办"后，政务服务事项平均办理时间由5天缩短至1.5天，群众满意度提升至98%。',['政务服务效率提高','群众满意度下降','办理时间变长','一网通办没有效果'],0,'考点：细节判断——数据变化方向。','办理时间5天→1.5天缩短，满意度98%，可推出效率提高。','抓数据变化方向即可判断。','B、C、D与原文相反。'),
Q('yuyan','high','逻辑填空','好干部的标准是具体的，那就是____坚定、为民服务、勤政务实、敢于担当、清正廉洁。',['信仰','信念','理想','志向'],1,'考点：逻辑填空——固定表述"信念坚定"。','好干部标准第一句即"信念坚定"，是规范表述。','时政规范表述要牢记。','"信仰"多与"坚定"也搭配，但标准提法为"信念坚定"。'),
Q('yuyan','high','中心理解','一座城市的文明程度，不仅看高楼大厦的高度，更看公共服务的温度、市民素质的厚度。这段文字意在强调：',['城市文明只看建筑','城市文明更体现在软实力','市民素质不重要','公共服务可有可无'],1,'考点：中心理解——"不仅…更…"递进，重点在软实力。','"不仅看高度，更看温度、厚度"，强调文明体现在服务与素质等软实力。','递进关系重点在后。','A、C、D与文意不符。'),
Q('yuyan','high','细节判断','下列表述不符合原文的是：我国数字政府建设加快推进，全国一体化政务服务平台实名用户超过10亿，高频事项基本实现"跨省通办"。',['政务平台实名用户超10亿','高频事项可跨省办理','数字政府建设在推进','政务平台用户不足1亿'],3,'考点：细节判断——反向选择。','原文"超过10亿"，D"不足1亿"与原文矛盾。','问"不符合"，找与原文数字冲突的选项。','A、B、C均与原文一致。'),
Q('yuyan','high','逻辑填空','青年人要____青春、不负韶华，在奋斗中绽放绚丽之花。',['珍惜','糟蹋','虚度','荒废'],0,'考点：逻辑填空——"珍惜青春"搭配+正面语境。','"珍惜青春、不负韶华"是正向鼓励，选"珍惜"。','看感情色彩，选与"绽放绚丽之花"一致的褒义词。','B、C、D均为贬义。'),
Q('yuyan','high','中心理解','乡村振兴，既要塑形，也要铸魂。塑形，就是改善人居环境；铸魂，就是繁荣乡村文化、培育文明乡风。文段主要说明：',['乡村振兴只需改善环境','乡村振兴要物质文明和精神文明并重','乡村文化不重要','人居环境无需改善'],1,'考点：中心理解——并列结构，概括全面。','"既要塑形(环境)也要铸魂(文化)"，说明物质与精神并重。','并列结构要概括全面，不可只取一面。','A、C、D均片面或错误。'),
Q('yuyan','high','细节判断','可以推出的是：某省持续推进"口袋公园"建设，2023年新建口袋公园215个，惠及周边居民约80万人。',['口袋公园惠及了周边居民','居民数量减少','口袋公园建设停止','只有城区有公园'],0,'考点：细节判断——合理推断。','原文明确"惠及周边居民约80万人"，A可推出。','简单推断题直接对应原文事实。','B、C、D无中生有。'),
Q('yuyan','high','逻辑填空','历史和现实都证明，没有哪个国家能____对外开放而实现现代化。',['拒绝','坚持','扩大','深化'],0,'考点：逻辑填空——语境判断，双重否定表肯定。','"没有哪个国家能拒绝对外开放而实现现代化"即都必须开放，选"拒绝"。','注意"没有…能…而…"的否定结构。','B、C、D语义不通。'),
Q('yuyan','high','中心理解','功成不必在我，并不是消极、怠政，而是要我们多做打基础、利长远的事；功成必定有我，则是一种担当和追求。这段话的主旨是：',['工作可以不求实效','要正确处理潜绩与显绩、担当与追求的关系','不必在乎工作成果','打基础的工作没有意义'],1,'考点：中心理解——对举概念，抓辩证关系。','"功成不必在我"指不贪一时之功、多做长远事；"功成必定有我"指担当作为，两者辩证统一。','对举的两句话要把握其辩证统一关系。','A、C、D曲解文意。'),
Q('yuyan','high','细节判断','下列说法正确的是：我国高铁运营里程达4.2万公里，稳居世界第一；其中时速350公里的线路占比约三成。',['我国高铁里程世界领先','时速350公里线路占比超过一半','高铁里程不断萎缩','我国没有时速350公里线路'],0,'考点：细节判断——数字与方向比对。','原文"稳居世界第一"，A正确。','抓关键词"稳居第一"判断。','B"超过一半"错(约三成)；C、D错误。'),
Q('yuyan','high','逻辑填空','要坚持绿水青山就是金山银山的理念，坚定不移走____优先、绿色发展之路。',['生态','经济','速度','规模'],0,'考点：逻辑填空——固定搭配"生态优先"。','"生态优先、绿色发展"是规范表述。','生态类固定提法要熟记。','其余选项与"绿色发展之路"不搭。'),
Q('yuyan','high','中心理解','学习从来不是一劳永逸的事。当今世界，知识更新不断加快，稍有懈怠，就会落后于时代。因此，我们要树立终身学习的理念。文段的结论是：',['学习可以一劳永逸','知识更新已经停止','要树立终身学习理念','落后于时代是必然'],2,'考点：中心理解——"因此"后是结论。','"因此"引出结论"要树立终身学习的理念"，是主旨。','结论词"因此、所以、可见"后多为答案。','A与文意相反。'),
Q('yuyan','high','细节判断','与原文相符的是：2023年我国快递业务量达1320亿件，连续十年位居世界第一，快递员数量约490万人。',['我国快递业务量世界第一','快递业务量连续十年下降','快递员数量不断减少','我国快递业务量位居世界第二'],0,'考点：细节判断——事实比对。','原文"连续十年位居世界第一"，A正确。','抓原文核心事实比对。','B、C、D与原文矛盾。'),
Q('yuyan','high','逻辑填空','推动高质量发展，必须完整、准确、____贯彻新发展理念。',['全面','片面','部分','粗略'],0,'考点：逻辑填空——固定表述"完整、准确、全面贯彻"。','"完整、准确、全面贯彻新发展理念"是规范表述。','时政规范表述要精准。','其余选项语义不符。'),
Q('yuyan','high','中心理解','科技创新是"关键变量"，也是高质量发展"最大增量"。抓住了创新，就抓住了牵动经济社会发展全局的"牛鼻子"。文段强调：',['创新对高质量发展至关重要','创新可有可无','发展不需要创新','科技创新是唯一变量'],0,'考点：中心理解——比喻强调创新是关键。','"关键变量""最大增量""牛鼻子"反复强调创新对高质量发展的极端重要性。','反复出现的主题词+比喻强化，即主旨。','B、C错误，D"唯一"绝对化。'),
Q('yuyan','high','细节判断','不能从材料推出的是：某市"双减"政策实施后，学科类培训机构压减率达92%，学生作业负担明显减轻，课后服务实现全覆盖。',['学科类培训机构大幅减少','学生作业负担减轻','课后服务全覆盖','所有学生成绩都提高了'],3,'考点：细节判断——"不能推出"反向选择。','材料只涉及负担减轻，未提成绩变化，D"成绩提高"无法推出。','"不能推出"题排除无中生有项。','A、B、C均有原文依据。'),
Q('yuyan','high','逻辑填空','新征程上，唯有____实干，才能把宏伟蓝图一步步变为美好现实。',['真抓','空谈','敷衍','虚假'],0,'考点：逻辑填空——"真抓实干"固定搭配。','"真抓实干"是规范成语搭配。','积累"真抓实干"等高频成语。','其余选项为贬义。'),
Q('yuyan','high','中心理解','人民是历史的创造者，是真正的英雄。只要我们紧紧依靠人民，就没有克服不了的困难。文段强调的核心是：',['人民的力量是无穷的','困难无法克服','历史与人民无关','个人英雄主义'],0,'考点：中心理解——首句即主旨。','首句"人民是历史的创造者、真正的英雄"开门见山，强调人民力量。','首句主旨型文段，直接抓首句观点。','B、C、D错误。'),
Q('yuyan','high','细节判断','与原文一致的是：我国已建成全球规模最大的社会保障体系，基本养老保险覆盖超10亿人，基本医疗保险覆盖超13亿人。',['我国社会保障体系全球规模最大','养老保险覆盖不足1亿人','医疗保险覆盖不断缩小','社会保障体系尚不健全'],0,'考点：细节判断——事实比对。','原文"全球规模最大的社会保障体系"，A正确。','抓"最大"等程度词比对。','B、C、D与原文矛盾。')

Q('panduan','basic','图形推理','图形序列为：■、■■、■■■、■■■■、？。问号处应是：',['■■','■■■','■■■■■','□'],2,'考点：图形推理——数量递增规律。','黑色方块数量依次为1、2、3、4，下一个应为5个，即■■■■■。','数量规律题数清元素个数，找等差/递推。','注意区分"递增"与"翻倍"。'),
Q('panduan','basic','图形推理','图形由外到内依次为：正方形套正方形、圆形套圆形、三角形套三角形，下一个应是：',['正方形套圆形','三角形套三角形','圆形套正方形','六边形套六边形'],3,'考点：图形推理——相似图形嵌套的延伸。','规律是"同形状嵌套"，且形状按边数递增(4、圆、3)，下一形状继续扩展为六边形套六边形。','规律题抓共同点：同形嵌套。','此题较难，注意"同形嵌套"这一稳定特征。'),
Q('panduan','basic','定义判断','"首因效应"指交往双方形成的第一次印象对今后交往关系的影响，即"先入为主"的效果。下列属于首因效应的是：',['相处久了才发现对方的优点','第一次见面觉得对方可靠，此后一直很信任','长期同事突然疏远','经过思考改变了对某人的看法'],1,'考点：定义判断——抓关键词"第一次印象"的影响。','B中"第一次见面觉得可靠，此后一直信任"符合"第一印象影响后续"。','定义判断抓定义中的主体、条件、结果关键词逐一对应。','A强调"相处久了"、D强调"改变"，均非首因效应。'),
Q('panduan','basic','定义判断','"碳中和"指通过植树造林、节能减排等形式，抵消自身产生的二氧化碳排放，实现"零排放"。下列做法属于碳中和范畴的是：',['大量焚烧秸秆','企业通过购买林业碳汇抵消排放','增加煤炭使用','砍伐森林'],1,'考点：定义判断——抓"抵消排放、零排放"。','B"购买碳汇抵消排放"符合"抵消自身排放"。','抓定义核心动作"抵消排放"。','A、C、D均为增加排放行为。'),
Q('panduan','basic','类比推理','教师 ： 教书育人 相当于 医生 ： ？',['救死扶伤','种地','驾驶','烹饪'],0,'考点：类比推理——职业与职责对应。','教师职责是教书育人，医生职责是救死扶伤，均为职业对应其崇高职责。','类比题先明确逻辑关系(职业-职责、工具-用途等)。','注意两组词关系需完全一致。'),
Q('panduan','basic','类比推理','书籍 ： 知识 相当于 食物 ： ？',['能量','饥饿','餐厅','厨师'],0,'考点：类比推理——来源与获得物对应。','读书获取知识，进食获取能量，均为"获取来源—所获之物"。','找准对应关系：A是B的来源。','"饥饿"是需求而非所得。'),
Q('panduan','basic','加强削弱','论点：多喝牛奶有助于青少年长高。下列最能支持该论点的是：',['牛奶价格较高','研究表明，牛奶富含钙和蛋白质，是骨骼发育所需的重要营养','很多青少年不爱喝牛奶','长高主要靠遗传'],1,'考点：加强削弱——支持论点需补充正面依据。','B给出"牛奶富含骨骼发育所需营养"的机制依据，直接支持论点。','加强题选"解释原因/补充证据/排除他因"的选项。','A、C无关，D削弱论点。'),
Q('panduan','basic','加强削弱','论点：手机使用是导致青少年近视的主要原因。下列最能削弱该论点的是：',['青少年使用手机时间很长','研究表明，户外活动不足和遗传也是近视的重要因素','手机屏幕有护眼模式','近视需要配眼镜'],1,'考点：加强削弱——削弱可提出他因。','B指出近视还有其他重要因素(户外不足、遗传)，削弱"手机是主要原因"。','削弱题找"他因、因果倒置、另有他因"。','A支持论点，C、D无关。'),

/* ============ 状态管理 ============ */
const KEY='gkzb_v1';
const BASELINE=20;
function defaultState(){
  return {
    settings:{ examName:'2027国考', targetDate:'', targetScore:70, jobScore:0, planStart:'' },
    stats:{},
    modStats:{yuyan:{q:0,c:0},panduan:{q:0,c:0},ziliao:{q:0,c:0},changshi:{q:0,c:0},shuliang:{q:0,c:0}},
    topicStats:{},
    wrongBook:[],
    planDone:{},
    customQuestions:[],
    scoreHistory:[],
    checklist:{},
    lastExam:null
  };
}
let state;
function load(){
  try{
    const raw=localStorage.getItem(KEY);
    const d=defaultState();
    if(!raw) return d;
    const s=JSON.parse(raw);
    for(const k in d){ if(s[k]===undefined) s[k]=d[k]; }
    for(const k of MODKEYS){ if(!s.modStats[k]) s.modStats[k]={q:0,c:0}; }
    if(!s.settings) s.settings=d.settings;
    if(!s.topicStats) s.topicStats={};
    if(!s.checklist) s.checklist={};
    return s;
  }catch(e){ return defaultState(); }
}
function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }
state=load();

/* ============ 日期工具 ============ */
function fmtDate(d){ const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
function todayStr(){ return fmtDate(new Date()); }
function parseDate(s){ const p=s.split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
function addDaysStr(s,n){ const d=parseDate(s); d.setDate(d.getDate()+n); return fmtDate(d); }
function daysUntil(target){
  if(!target) return null;
  const now=new Date(); now.setHours(0,0,0,0);
  const d=parseDate(target);
  return Math.ceil((d-now)/86400000);
}
function dayRecord(){
  const k=todayStr();
  if(!state.stats[k]) state.stats[k]={mood:null,questions:0,correct:0,durationSec:0,estScore:0,reviewDone:false};
  return state.stats[k];
}

/* ============ 统计 ============ */
function overall(){ let q=0,c=0; for(const k in state.stats){ q+=state.stats[k].questions; c+=state.stats[k].correct; } return {q,c}; }
function estScore(){ const o=overall(); return o.q? Math.round((o.c/o.q)*100) : null; }
function moduleAcc(m){ const s=state.modStats[m]; return s.q? (s.c/s.q*100) : null; }
function weakModules(n){
  const arr=MODKEYS.map(m=>({m,acc:moduleAcc(m),q:state.modStats[m].q}))
    .filter(x=>x.q>=5 && x.acc!==null).sort((a,b)=>a.acc-b.acc);
  return arr.slice(0,n);
}
function weakTopics(n){
  const arr=Object.keys(state.topicStats).map(t=>({t,q:state.topicStats[t].q,c:state.topicStats[t].c,acc:state.topicStats[t].c/state.topicStats[t].q*100}))
    .filter(x=>x.q>=3).sort((a,b)=>a.acc-b.acc);
  return arr.slice(0,n);
}
function computeStreak(){
  let streak=0; const d=new Date();
  if(!(state.stats[todayStr()]&&state.stats[todayStr()].questions>0)) d.setDate(d.getDate()-1);
  while(state.stats[fmtDate(d)] && state.stats[fmtDate(d)].questions>0){ streak++; d.setDate(d.getDate()-1); }
  return streak;
}
function recordAnswer(mod,topic,correct,durSec){
  const r=dayRecord(); r.questions++; if(correct) r.correct++; r.durationSec+=durSec;
  state.modStats[mod].q++; if(correct) state.modStats[mod].c++;
  if(topic){ if(!state.topicStats[topic]) state.topicStats[topic]={q:0,c:0}; state.topicStats[topic].q++; if(correct) state.topicStats[topic].c++; }
  r.estScore = Math.round((r.correct/r.questions)*100);
  const e=estScore(); if(e!==null && r.questions%10===0){ if(!state.scoreHistory.some(h=>h.date===todayStr())) state.scoreHistory.push({date:todayStr(),score:e}); }
  save();
}

/* ============ 错题本 ============ */
const INTERVALS=[1,3,7,15];
function addWrong(q,myAnswer,reason){
  const ex=state.wrongBook.find(x=>x.qid===q.id);
  if(ex){ ex.wrongCount++; ex.lastWrongDate=todayStr(); ex.myAnswer=myAnswer; ex.wrongReason=reason; ex.correctStreak=0; ex.status='active'; ex.nextReviewDate=addDaysStr(todayStr(),1); }
  else{
    state.wrongBook.push({qid:q.id,module:q.mod,topic:q.topic,diff:q.diff,stem:q.stem,opts:q.opts,ans:q.ans,analysis:q.analysis,
      myAnswer, wrongReason:reason, wrongCount:1, lastWrongDate:todayStr(), correctStreak:0, status:'active', nextReviewDate:addDaysStr(todayStr(),1)});
  }
  save();
}
function dueReviews(){ return state.wrongBook.filter(e=>e.status==='active' && e.nextReviewDate<=todayStr()); }
function activeWrong(){ return state.wrongBook.filter(e=>e.status==='active'); }
function masteredWrong(){ return state.wrongBook.filter(e=>e.status==='mastered'); }
function reviewCorrect(e){
  e.correctStreak++;
  if(e.correctStreak>=3){ e.status='mastered'; e.masteredDate=todayStr(); }
  else e.nextReviewDate=addDaysStr(todayStr(), INTERVALS[Math.min(e.correctStreak,3)]);
  save();
}
function reviewWrong(e,reason){
  e.wrongCount++; e.correctStreak=0; e.lastWrongDate=todayStr(); e.nextReviewDate=addDaysStr(todayStr(),1); if(reason) e.wrongReason=reason;
  save();
}
function setMastered(id,v){ const e=state.wrongBook.find(x=>x.qid===id); if(e){ e.status=v?'mastered':'active'; if(v){e.masteredDate=todayStr();e.correctStreak=3;} else {e.correctStreak=0;e.nextReviewDate=todayStr();} save(); } }

function planStartDate(){

    else state.settings.planStart=todayStr();
    save();
  }
  return state.settings.planStart;
}
function planDayIndex(){
  const s=parseDate(planStartDate()); const n=parseDate(todayStr());
  return Math.max(0, Math.floor((n-s)/86400000));
}
function planTasks(dayIndex){
  const wk=WEEK_PLAN[Math.min(7,Math.floor(dayIndex/7))];

  let m=wk.focus;
  if(m==='all'||m==='weak') m=MODKEYS[day%MODKEYS.length];

  return [`本周复盘：回顾错题TOP3`,`完成${mName}半套模考`,`申论：整理本周金句素材`];
}

function consecutiveBadMood(){
  let n=0; const d=new Date();
  while(true){ const r=state.stats[fmtDate(d)]; if(r&&r.mood==='bad'){n++;d.setDate(d.getDate()-1);} else break; }
  return n;
}
function missedBaselineStreak(){
  const start=state.settings.planStart; if(!start) return 0;
  let n=0; const d=new Date(); d.setDate(d.getDate()-1);
  for(let i=0;i<30;i++){ const k=fmtDate(d); if(k<start) break; const r=state.stats[k]; if(!r||r.questions<BASELINE){n++;d.setDate(d.getDate()-1);} else break; }
  return n;
}
function isReduced(){ return consecutiveBadMood()>=2 || missedBaselineStreak()>=3; }

function pickMod(m){ P={mod:m,diff:P&&P.diff||'basic'}; renderPractice(); }
function pickDiff(d){ P={mod:P&&P.mod||'yuyan',diff:d}; renderPractice(); }
function startPractice(){
  const mod=P?P.mod:'yuyan'; const diff=P?P.diff:'basic';
  let pool=BANK[mod].filter(q=>q.diff===diff); if(pool.length<3) pool=BANK[mod].slice();
  if(mod==='changshi') pool=pool.concat(state.customQuestions.filter(q=>q.diff===diff||true));
  if(pool.length===0){ toast('该模块暂无可练题目'); return; }
  const qs=shuffle(pool).slice(0,10);
  P={mod,diff,qs,idx:0,correct:0,wrong:0,phase:'question',answered:false,selected:-1,started:Date.now()};
  renderPQuestion();
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function renderPQuestion(){
  const q=P.qs[P.idx]; if(!q){ renderPResult(); return; }

  const secs=({basic:60,mid:50,high:40})[q.diff]||50;
  $('view-practice').innerHTML=`<div class="card"><div class="row"><span class="badge">第 ${P.idx+1}/${P.qs.length} 题</span><span class="badge">${MODS[q.mod].icon} ${MODS[q.mod].name} · ${DIFFS[q.diff]}</span></div>

  const oh=q.opts.map((o,i)=>`<div class="opt" id="opt-${i}" onclick="answerPractice(${i})"><span class="key">${'ABCD'[i]}</span><span>${esc(o)}</span></div>`).join('');
  $('p-opts').innerHTML=oh;
  startQTimer(secs);
}
function startQTimer(secs){ clearInterval(qTimer); qRemain=secs; qTimer=setInterval(()=>{ qRemain--; const t=$('q-timer'); if(t){ t.textContent=qRemain; t.className='timer-big timer '+(qRemain<=10?'danger':qRemain<=20?'warn':'');} if(qRemain<=0){ clearInterval(qTimer); onTimeUp(); } },1000); }
function onTimeUp(){ if(P.answered) return; answerPractice(-1,true); }
function answerPractice(i,timeUp){
  if(P.answered) return; P.answered=true; clearInterval(qTimer);
  const q=P.qs[P.idx]; P.selected=i;
  const ok=(i===q.ans);
  const dur=({basic:60,mid:50,high:40})[q.diff]-(timeUp?0:qRemain);
  if(ok){ P.correct++; recordAnswer(q.mod,q.topic,true,dur); }
  else { P.wrong++; recordAnswer(q.mod,q.topic,false,dur); }
  // 渲染选项状态
  q.opts.forEach((_,idx)=>{ const el=$('opt-'+idx); if(!el) return; el.classList.add('dim'); if(idx===q.ans) el.classList.add('correct'); else if(idx===i) el.classList.add('wrong'); });
  let ana=renderAnalysis(q,i);
  if(!ok){
    ana+=`<div class="card" style="padding:12px"><div class="h" style="font-weight:700;margin-bottom:8px">❓ 请选择错因（系统将给出针对性建议）</div>

        <button class="btn ghost sm" onclick="setWrongReason('${q.id.replace(/[^a-z0-9]/gi,'')}','粗心大意')">粗心大意</button>
        <button class="btn ghost sm" onclick="setWrongReason('${q.id.replace(/[^a-z0-9]/gi,'')}','时间不足')">时间不足</button>
      </div>
      <div id="p-reason-advice"></div></div>`;
  }
  ana+=`<div class="btn grp" style="margin-top:12px">
    <button class="btn ghost" onclick="variantPractice()">🔁 同考点变式</button>
    <button class="btn" onclick="nextPractice()">${P.idx+1>=P.qs.length?'查看结果':'下一题'} →</button>
  </div>`;
  $('p-ana').innerHTML=ana;
}

function nextPractice(){ P.idx++; if(P.idx>=P.qs.length){ renderPResult(); } else { renderPQuestion(); } }
function variantPractice(){
  const q=P.qs[P.idx];
  const pool=(q.mod==='changshi'?BANK[q.mod].concat(state.customQuestions):BANK[q.mod]).filter(x=>x.topic===q.topic && x!==q);
  if(pool.length===0){ toast('该考点暂无更多变式题'); return; }

  P.qs.splice(P.idx+1,0,nq);

function trendChart(trend){
  const labels=['6天前','5天前','4天前','3天前','2天前','昨天','今天'];
  const has=trend.some(t=>t!==null);
  if(!has) return '<div class="muted">暂无数据</div>';
  const W=340,H=120,pad=24;
  const pts=trend.map((t,i)=>({x:pad+i*(W-2*pad)/6, y:H-pad-((t==null?0:t)/100)*(H-2*pad), v:t}));
  let line=pts.map((p,i)=>`${i?'L':'M'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  let dots=pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="3" fill="${p.v===null?'#444':'var(--accent)'}"/>`).join('');

  return `<svg class="chart" viewBox="0 0 ${W} ${H}"><line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="var(--border)"/><line x1="${pad}" y1="${pad}" x2="${pad}" y2="${H-pad}" stroke="var(--border)"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2"/>${dots}${lab}</svg>`;

function scoreChart(){
  const h=state.scoreHistory; if(h.length<2) return '<div class="muted">数据不足，多做几组题。</div>';
  const last=h.slice(-15); const W=340,H=140,pad=24;
  const max=Math.max(100, ...last.map(x=>x.score)); const min=Math.min(0,...last.map(x=>x.score));
  const pts=last.map((x,i)=>({x:pad+i*(W-2*pad)/(last.length-1), y:H-pad-((x.score-min)/(max-min))*(H-2*pad), s:x.score}));
  const line=pts.map((p,i)=>`${i?'L':'M'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const dots=pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="3" fill="var(--green)"/>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}"><line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="var(--border)"/><line x1="${pad}" y1="${pad}" x2="${pad}" y2="${H-pad}" stroke="var(--border)"/><path d="${line}" fill="none" stroke="var(--green)" stroke-width="2"/>${dots}</svg>`;
}

    <div class="card"><h3>🗓️ 每日学习计划</h3><div class="muted">第 ${di+1} 天 · ${weekTitle(di)}${dl!==null?' · 距考试 '+dl+' 天':''}</div>
    <div class="pbar"><div class="fill" style="width:${Math.min(100,di/56*100)}%"></div></div><div class="small">8周大纲进度 ${Math.round(Math.min(100,di/56*100))}%</div></div>`;
  html+=`<div class="card"><h3>今日任务</h3><div class="checklist">`;
  tasks.forEach((t,i)=>{ html+=`<label><input type="checkbox" ${done[i]?'checked':''} onchange="togglePlan(${i})"><span class="${done[i]?'strike':''}">${esc(t)}</span></label>`; });
  html+=`</div></div>`;
  html+=`<div class="card"><h3>8周大纲</h3>${WEEK_PLAN.map((w,i)=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--border)"><span>第${i+1}周 · ${w.t}</span><span class="muted small">${w.shen}</span></div>`).join('')}</div>`;
  // 周日复盘
  if(new Date().getDay()===0){ html+=`<button class="btn warn" onclick="weekReview()">📋 本周复盘问卷</button>`; }
  $('view-sub').innerHTML=html;
}
function weekReview(){
  const r=dayRecord(); if(r.reviewDone){ toast('本周复盘已完成'); return; }
  openModal(`<button class="close" onclick="closeModal()">×</button><h3>📋 本周复盘</h3>
    <label class="fl">1. 本周最大的收获是什么？</label><textarea id="wr1"></textarea>
    <label class="fl">2. 本周遇到的最大困难是什么？</label><textarea id="wr2"></textarea>
    <label class="fl">3. 下周最想突破的一个点是什么？</label><textarea id="wr3"></textarea>
    <button class="btn" style="margin-top:12px" onclick="saveWeekReview()">提交复盘</button>`);
}
function saveWeekReview(){
  const r=dayRecord(); r.reviewDone=true; r.review={a1:$('wr1').value,a2:$('wr2').value,a3:$('wr3').value}; save(); closeModal(); toast('复盘已保存，下周加油 💪');
}

/* ============ 时政更新 ============ */
function renderShizheng(){
  let html=`<div class="backbar" onclick="closeSub()">← 返回作战台</div>
    <div class="card"><h3>📰 时政更新</h3><div class="muted">手动粘贴最新时政题目和解析，将自动加入常识判断刷题池。当前已有 ${state.customQuestions.length} 道自建时政题。</div></div>
    <div class="card"><h3>新增时政题</h3>
      <label class="fl">题干</label><textarea id="sz-stem" placeholder="粘贴题目题干…"></textarea>
      <label class="fl">选项（每行一个，共4个；可不填）</label><textarea id="sz-opts" placeholder="A. 选项一&#10;B. 选项二&#10;C. 选项三&#10;D. 选项四"></textarea>
      <label class="fl">正确答案（填 A/B/C/D，或直接填答案文本）</label><input id="sz-ans" placeholder="例如 B">
      <label class="fl">考点</label><input id="sz-topic" placeholder="例如：2026年政府工作报告">
      <label class="fl">解析（可选）</label><textarea id="sz-kd" placeholder="考点/解题/技巧/易错点…"></textarea>
      <button class="btn" style="margin-top:12px" onclick="addCustomQ()">➕ 加入常识题库</button></div>`;
  if(state.customQuestions.length){ html+=`<div class="section-title">已添加的时政题</div>${state.customQuestions.slice().reverse().map(q=>`<div class="card" style="padding:12px"><div class="small muted">${esc(q.topic)}</div><div style="margin:6px 0">${esc(q.stem)}</div><div class="small">答案：<span class="green">${esc(q.opts[q.ans]||q.ansText)}</span></div></div>`).join('')}`; }
  $('view-sub').innerHTML=html;
}
function addCustomQ(){
  const stem=$('sz-stem').value.trim(); if(!stem){ toast('请填写题干'); return; }
  const opts=$('sz-opts').value.split('\n').map(s=>s.replace(/^[A-D][\.、\s]+/,'').trim()).filter(Boolean);
  const ansRaw=$('sz-ans').value.trim();
  let ans=0,ansText='';
  if(/^[A-Da-d]$/.test(ansRaw)) ans=ansRaw.toUpperCase().charCodeAt(0)-65;
  else ansText=ansRaw;
  const topic=$('sz-topic').value.trim()||'时政';
  const kd=$('sz-kd').value.trim()||'时政常识，注意积累最新热点。';
  const id='custom_'+Date.now();
  state.customQuestions.push({id,mod:'changshi',diff:'basic',topic,stem,opts:opts.length===4?opts:['选项A','选项B','选项C','选项D'],ans,ansText,analysis:{kd,steps:kd,skill:'时政题关注最新政策、会议、数据。',trap:'注意时间、数据、表述的准确性。'}});
  save(); $('sz-stem').value='';$('sz-opts').value='';$('sz-ans').value='';$('sz-topic').value='';$('sz-kd').value='';
  renderShizheng(); toast('已加入常识题库 ✓');
}

/* ============ 最终作战策略 ============ */
function showStrategy(){
  const order=MODKEYS.map(m=>({m,acc:moduleAcc(m),q:state.modStats[m].q})).sort((a,b)=>(b.acc||0)-(a.acc||0));
  const list=order.map((o,i)=>`${i+1}. ${MODS[o.m].icon} ${MODS[o.m].name}${o.acc===null?'（数据不足）':'（正确率'+Math.round(o.acc)+'%）'}`).join('<br>');
  openModal(`<button class="close" onclick="closeModal()">×</button><h3>🎯 最终作战策略</h3>
    <div class="ana"><div class="h">推荐做题顺序（按你的正确率排序）</div><p>${list}</p></div>
    <div class="ana" style="border-color:var(--orange)"><div class="h orange">时间分配建议（120分钟）</div>
      <p>• 资料分析：25分钟（性价比最高，务必优先）</p><p>• 判断推理：30分钟</p><p>• 言语理解：30分钟</p><p>• 常识判断：10分钟（快速过，不恋战）</p><p>• 数量关系：15分钟（只做会的，其余蒙B）</p><p>• 涂卡预留：10分钟</p></div>
    <div class="ana" style="border-color:var(--green)"><div class="h green">考场物品清单</div>${examChecklistHtml(true)}</div>`);
}
const EXAM_ITEMS=['准考证','身份证','2B铅笔','橡皮','黑色签字笔','手表','水','巧克力'];
function examChecklistHtml(interactive){
  const items=EXAM_ITEMS.map(it=>`<label class="row" style="padding:8px 0;border-bottom:1px solid var(--border)"><span>${interactive?'<input type="checkbox" style="width:18px;height:18px;accent-color:var(--accent)" '+(state.checklist[it]?'checked':'')+' onchange="state.checklist[\''+it+'\']=this.checked;save()">':''} ${it}</span></label>`).join('');
  return `<div class="checklist">${items}</div>`;
}
function renderChecklistCard(){
  return `<div class="card"><h3>🎒 考场物品清单</h3>${examChecklistHtml(true)}<div class="help">睡前对照打勾，缺一不可。</div></div>`;
}

/* ============ 事件绑定 ============ */
document.getElementById('tabbar').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b&&b.dataset.tab) switchTab(b.dataset.tab); });
document.getElementById('modal-bg').addEventListener('click',e=>{ if(e.target.id==='modal-bg') closeModal(); });

/* ============ 初始化 ============ */
switchTab('home');

</script>
</body>
</html>
